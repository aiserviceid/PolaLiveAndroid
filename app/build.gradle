plugins {
    id 'com.android.application'
}

android {
    namespace 'com.polalive.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.polalive.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled OCR model: works immediately after install, no model download needed.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
